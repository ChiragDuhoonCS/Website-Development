<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors</title>
    <style>
        /* Element Selector  */
        div{
             background-color: red; 
        }

        /*! Class Selector only with .red get this */
        .red{
            background-color: red;
        }

        /* Id Selector */
        #green{
            background-color: green;
        }

        /* Child Selectors  div ka inside direct */
        div > p {
            color: blue;
            background-color: brown;
        }

        /* Descendant Selector div ka inside indirect/direct dont care */
        div p {
            color: blue;
            background-color: brown;
        }

        /* Universal Selector  means sara element */
        * {
            margin:0;
            padding: 0;
        }

        /* Pseudo Selector  */
        /* when we visited link    */
        a:visited{ 
            color: yellow
        }

        a:link {
            color: green;
        }
       /*jab link ko click kar rha ho */ 
        a:active{
            background-color: red;
        }
       /*jab link ko mouse sa hover kar rha ho */ 
        a:hover{
            background-color: yellow;
        }


        p:first-child{
            background-color: aqua;
        }

    </style>
</head>
<body>
    <main class="one">
        <p>I am first</p>
        <p>I am second</p>
    </main>
    <div class="red">
        I am a div
        <article>

            <p>I am a para inside div</p>
        </article>
    </div>

    <div id="green">
        I am another div
    </div>
    <a href="https://www.google.com">Go to Google</a>
    <a href="https://www.facebook2.com">Go to Facebook</a>
</body>
</html>
